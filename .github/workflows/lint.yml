name: lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck setup.sh install.sh uninstall.sh \
                     bin/onedrive-sync bin/onedrive-watch \
                     tests/dependency-matrix.sh tests/install-flow.sh \
                     tests/filters.sh tests/tray.sh tests/docs.sh \
                     tests/lib/harness.sh \
                     extras/networkmanager-dispatcher.sh \
                     extras/watch-issues.sh extras/install-issue-watch.sh

      - name: Shell syntax
        run: |
          for f in setup.sh install.sh uninstall.sh bin/onedrive-sync bin/onedrive-watch \
                   tests/dependency-matrix.sh tests/install-flow.sh tests/filters.sh \
                   tests/tray.sh tests/docs.sh tests/lib/harness.sh \
                   extras/watch-issues.sh extras/install-issue-watch.sh; do
            bash -n "$f"
          done
          sh -n extras/networkmanager-dispatcher.sh

      - name: Python syntax
        run: |
          python3 -m py_compile bin/onedrive-tray
          python3 -m py_compile tests/lib/load_module.py tests/lib/pyshim/sitecustomize.py

      - name: Templates contain their placeholders
        run: |
          grep -q '%SYNC_SCRIPT%'  systemd/onedrive-sync.service.in
          grep -q '%INTERVAL%'     systemd/onedrive-sync.timer.in
          grep -q '%WATCH_SCRIPT%' systemd/onedrive-watch.service.in
          grep -q '%TRAY_SCRIPT%'  autostart/rclone-onedrive-tray.desktop.in

  tests:
    # Second environment on purpose: this runner's distribution, systemd, bash and
    # rclone are all older than the machine the project was written on, so a green
    # job is a data point rather than a repeat of the same run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the dependencies the suites probe for
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone inotify-tools python3-gi python3-cairo \
            gir1.2-gtk-3.0 gir1.2-ayatanaappindicator3-0.1 gir1.2-notify-0.7 \
            libgtk-3-bin

      - name: Report the environment under test
        run: |
          . /etc/os-release; echo "os:      $PRETTY_NAME"
          echo "kernel:  $(uname -r)"
          echo "systemd: $(systemctl --version | head -1)"
          echo "bash:    $BASH_VERSION"
          echo "python3: $(python3 --version)"
          echo "rclone:  $(rclone version | head -1)"

      # One run per suite, with the count checked against tests/floors.txt.
      # A suite that skips everything still exits 0, so without this a runner
      # missing broadwayd would report "0 passed, 12 skipped" and stay green.
      - name: The suites, against their floors
        run: |
          set -uo pipefail
          status=0
          while read -r suite floor; do
            case "$suite" in ''|'#'*) continue ;; esac
            echo "::group::$suite"
            # GitHub runs a run: step with bash -e, so a suite that fails must
            # be caught here rather than aborting the step before its output is
            # printed.
            if out="$(tests/$suite --verbose 2>&1)"; then rc=0; else rc=$?; fi
            echo "$out"
            echo "::endgroup::"
            passed="$(printf '%s\n' "$out" | tail -1 |
                      grep -oE '[0-9]+ passed' | grep -oE '[0-9]+')"
            if [ "$rc" -ne 0 ]; then
              echo "::error::$suite exited $rc"
              status=1
            fi
            if [ "${passed:-0}" -lt "$floor" ]; then
              echo "::error::$suite reports ${passed:-0} passing, the floor is $floor"
              status=1
            fi
          done < tests/floors.txt
          exit "$status"
